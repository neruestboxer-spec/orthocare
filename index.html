<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F6BFF">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OrthoCare Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F6BFF'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Layar masuk -->
  <section id="login" class="login hidden" aria-label="Masuk">
    <div class="login-card">
      <div class="login-logo"><span class="ms fill">add</span></div>
      <p class="eyebrow">ORTHOCARE ADMIN</p>
      <h1>Masuk ke Klinik</h1>
      <p class="muted" id="login-sub">Masukkan kata sandi admin untuk membuka data klinik.</p>
      <form id="login-form" autocomplete="on">
        <label class="field">
          <span>Kata sandi admin</span>
          <div class="input-wrap">
            <span class="ms">lock</span>
            <input type="password" id="login-pw" autocomplete="current-password" required placeholder="••••••••">
            <button type="button" class="icon-btn" id="login-eye" aria-label="Tampilkan kata sandi"><span class="ms">visibility</span></button>
          </div>
        </label>
        <p class="login-err hidden" id="login-err"></p>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Masuk</button>
      </form>
      <p class="tiny muted center">Data rekam medis dilindungi sesuai UU PDP No. 27/2022</p>
    </div>
  </section>

  <!-- Aplikasi -->
  <div id="shell" class="shell hidden">
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama">
      <a href="#/beranda" data-nav="beranda"><span class="ms">home</span><span>Beranda</span></a>
      <a href="#/jadwal" data-nav="jadwal"><span class="ms">calendar_month</span><span>Jadwal</span></a>
      <a href="#/pasien" data-nav="pasien"><span class="ms">personal_injury</span><span>Pasien</span></a>
      <a href="#/keuangan" data-nav="keuangan"><span class="ms">payments</span><span>Keuangan</span></a>
      <a href="#/menu" data-nav="menu"><span class="ms">menu</span><span>Menu</span></a>
    </nav>
    <header class="topbar" id="topbar"></header>
    <main id="view" class="view" tabindex="-1"></main>
    <div id="bottom-bar-slot"></div>
    <a id="fab" class="fab hidden" href="#/jadwal/baru" aria-label="Tambah"><span class="ms">add</span></a>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="boot" class="boot"><div class="spinner"></div><p>Memuat OrthoCare…</p></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages-utama.js"></script>
  <script src="js/pages-pasien.js"></script>
  <script src="js/pages-kasir.js"></script>
  <script src="js/pages-admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
